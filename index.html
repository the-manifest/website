<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manifest — Humanoids for European Defence</title>
<meta name="description" content="Manifest is releasing a humanoid prototype on July 7th. Meet Pierre, our European Defence humanoid focused on inspection work.">
<link rel="icon" type="image/png" href="/favicon-dark.png" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/png" href="/favicon-light.png" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  // Redirect returning visitors instantly — runs before the body paints so they never see the picker flash
  (function() {
    var stored = localStorage.getItem('manifest-lang');
    if (stored === 'en' || stored === 'fr') {
      window.location.replace('/' + stored);
    }
  })();
</script>
<style>
  :root {
    --bg-warm: #ffffff;
    --text: #1a1a1a;
    --text-body: #3a3a3a;
    --text-muted: #7a7a7a;
    --accent: #1a1a1a;
    --border: #e2dfd8;
  }
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg-warm);
    color: var(--text);
    font-family: 'Lexend', system-ui, sans-serif;
    font-weight: 400;
    font-size: 18px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    text-align: center;
  }
  .picker {
    max-width: 460px;
    width: 100%;
    animation: fadeUp 0.6s ease 0.05s both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .picker img {
    height: 96px;
    width: auto;
    filter: brightness(0);
    margin-bottom: 40px;
  }
  .buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .lang-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 22px 18px;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    text-decoration: none;
    transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s;
    cursor: pointer;
    font-family: inherit;
  }
  .lang-btn:hover {
    border-color: var(--text);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.07);
  }
  .lang-btn .code {
    color: var(--accent);
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.16em;
  }
  .lang-btn .name {
    font-size: 1.15rem;
    font-weight: 600;
  }
  footer {
    position: fixed;
    bottom: 24px;
    left: 0; right: 0;
    text-align: center;
    color: var(--text-muted);
    font-size: 0.78rem;
  }
  @media (max-width: 480px) {
    .picker img { height: 72px; margin-bottom: 24px; }
    .buttons { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <main class="picker">
    <img src="/assets/logo.png" alt="Manifest">
    <div class="buttons">
      <a class="lang-btn" href="/en" data-lang="en">
        <span class="code">EN</span>
        <span class="name">English</span>
      </a>
      <a class="lang-btn" href="/fr" data-lang="fr">
        <span class="code">FR</span>
        <span class="name">Français</span>
      </a>
    </div>
  </main>
  <script>
    document.querySelectorAll('.lang-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        localStorage.setItem('manifest-lang', btn.dataset.lang);
      });
    });
  </script>
</body>
</html>
